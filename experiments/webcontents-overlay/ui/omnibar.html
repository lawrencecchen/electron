<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui.css">
  <title>Omnibar</title>
</head>
<body class="toolbar-body">
  <main class="toolbar">
    <button id="back" aria-label="Back">←</button>
    <button id="forward" aria-label="Forward">→</button>
    <button id="reload" aria-label="Reload">↻</button>
    <form id="address-form">
      <span id="status" aria-hidden="true"></span>
      <input id="address" aria-label="Address" autocomplete="off" spellcheck="false">
    </form>
    <button id="overlay" class="overlay-button">Overlay</button>
  </main>
  <script src="omnibar.js"></script>
</body>
</html>
